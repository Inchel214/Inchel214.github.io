<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d5e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Canvas border (dashed, infinite feel) -->
  <rect x="120" y="80" width="960" height="470" rx="12" fill="none" stroke="#6C5CE7" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Central node (highlighted) -->
  <g filter="url(#glow)">
    <rect x="520" y="270" width="160" height="80" rx="10" fill="url(#nodeFill)" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="600" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">智能客服项目</text>
    <text x="600" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a0a0c0">中心节点</text>
  </g>

  <!-- Branch nodes -->
  <g>
    <!-- Left: 目标 -->
    <rect x="180" y="150" width="130" height="56" rx="8" fill="url(#nodeFill)" stroke="#6C5CE7" stroke-width="1.5"/>
    <text x="245" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff">目标</text>

    <!-- Right: 技术方案 -->
    <rect x="890" y="150" width="130" height="56" rx="8" fill="url(#nodeFill)" stroke="#00B894" stroke-width="1.5"/>
    <text x="955" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff">技术方案</text>

    <!-- Bottom: 排期 -->
    <rect x="535" y="440" width="130" height="56" rx="8" fill="url(#nodeFill)" stroke="#6C5CE7" stroke-width="1.5"/>
    <text x="600" y="473" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff">排期</text>

    <!-- Sub-nodes -->
    <rect x="80" y="260" width="90" height="36" rx="6" fill="#1e1e40" stroke="#6C5CE7" stroke-width="1" opacity="0.7"/>
    <rect x="80" y="310" width="90" height="36" rx="6" fill="#1e1e40" stroke="#6C5CE7" stroke-width="1" opacity="0.7"/>
    <rect x="80" y="360" width="90" height="36" rx="6" fill="#1e1e40" stroke="#6C5CE7" stroke-width="1" opacity="0.7"/>

    <rect x="1030" y="260" width="90" height="36" rx="6" fill="#1e1e40" stroke="#00B894" stroke-width="1" opacity="0.7"/>
    <rect x="1030" y="310" width="90" height="36" rx="6" fill="#1e1e40" stroke="#00B894" stroke-width="1" opacity="0.7"/>
    <rect x="1030" y="360" width="90" height="36" rx="6" fill="#1e1e40" stroke="#00B894" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 520 300 L 310 178"/>
    <path d="M 680 300 L 890 178"/>
    <path d="M 600 350 L 600 440"/>
    <path d="M 180 178 L 170 278" stroke="#6C5CE7"/>
    <path d="M 180 178 L 170 328" stroke="#6C5CE7"/>
    <path d="M 180 178 L 170 378" stroke="#6C5CE7"/>
    <path d="M 1020 178 L 1030 278" stroke="#00B894"/>
    <path d="M 1020 178 L 1030 328" stroke="#00B894"/>
    <path d="M 1020 178 L 1030 378" stroke="#00B894"/>
  </g>

  <!-- Agent sparkles -->
  <g fill="#00B894" filter="url(#glow)">
    <path d="M 400 100 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
    <path d="M 800 520 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M 350 500 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
  </g>

  <!-- Title -->
  <text x="80" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6C5CE7" font-weight="600" letter-spacing="2">PROJECT</text>
  <text x="80" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff">无限画布 Agent</text>
  <text x="80" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a0a0c0">Infinite Canvas Agent · 用 AI 编排节点与整理内容</text>
</svg>
